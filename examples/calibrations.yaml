# Calibrations for the PhyloDater quick-start example. The tree and the alignment
# next to this file were produced by
# ``python test-data/benchmark/generate_benchmark_dataset.py --profile mini --out examples``
# (strict-clock JC69 simulation; see that script's docstring for the parameters).
#
# Three calibrations on three distinct nodes, consistent with the simulated truth
# (root 105 Ma, Homininae 9 Ma, Primates 75 Ma):
#   * Homininae - fixed age: PATHd8 and MD-Cat need at least one fixage point
#   * Primates  - uniform range
#   * root      - uniform range (two-sided, so no engine has to guess a midpoint)
calibrations:
  - name: Homininae
    mrca_pair: [Human, Gorilla]
    constraint:
      type: fixed
      age: 9.0

  - name: Primates
    mrca_pair: [Lemur, Human]
    constraint:
      type: uniform
      min: 70.0
      max: 80.0

  - name: Root
    is_root: true
    constraint:
      type: uniform
      min: 100.0
      max: 110.0
