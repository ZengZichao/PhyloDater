# Ground truth for the PhyloDater accuracy benchmark.
#
# Generated by generate_benchmark_dataset.py -- do not edit by hand.
# Ages are in millions of years before present (Ma); all 13 tips are
# contemporaneous (age 0). Branch lengths in tree.nwk equal
# (parent_age - child_age) * substitution_rate.
dataset:
  name: phylodater-accuracy-benchmark
  seed: 20260929
  alignment_length: 800
  substitution_model: JC69 (equal base frequencies)
  molecular_clock: strict (single rate for all branches)
  substitution_rate_per_site_per_myr: 1.500e-03
  tip_sampling_time: 0.0
  taxa: 10
  internal_nodes: 9
nodes:
  root:
    mrca_pair: [Human, Dog]
    true_age_ma: 105.000
  Euarchontoglires:
