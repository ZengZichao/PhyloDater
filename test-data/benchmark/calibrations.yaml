# Calibrations for the PhyloDater accuracy benchmark.
#
# Four calibrations on four distinct nodes, consistent with truth.yaml:
#   * Homininae - point (fixed) calibration on the human/gorilla MRCA (true 9 Ma)
#   * Primates  - uniform range centred on the true age (75 Ma)
#   * Glires    - uniform range centred on the true age (70 Ma)
#   * root      - uniform range centred on the true age (105 Ma)
#
# Every calibration is a point or a two-sided range on purpose: methods that only
# accept point calibrations (wLogDate, MD-Cat) degrade one-sided bounds such as
# "maximum" to the midpoint of the implied range, which can produce a chronology
# inconsistent with the remaining calibrations (e.g. a root younger than one of
# its own descendants) and then abort inside the upstream program. One-sided and
# probabilistic constraint types are exercised by the constraint-coverage dataset
# under examples/benchmark/degradation/ instead, where their degradation warnings
# are the object of the test rather than a nuisance.
#
# No two calibrations resolve to the same node: MCMCTree aborts when an internal
# calibration lands on the same node as the root calibration (the root age is
# written to the control file as RootAge, never into the tree).
calibrations:
  - name: Homininae
    mrca_pair: [Human, Gorilla]
    constraint:
      type: fixed
      age: 9.0

  - name: Primates
    mrca_pair: [Lemur, Human]
    constraint:
      type: uniform
      min: 68.0
      max: 82.0

  - name: Glires
    mrca_pair: [Rabbit, Mouse]
    constraint:
      type: uniform
      min: 60.0
      max: 80.0

  - name: Root
    is_root: true
    constraint:
      type: uniform
      min: 100.0
      max: 110.0
