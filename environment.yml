name: phylodater
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python
  # 下限 3.9：包需要 importlib.resources.files（3.9+），3.8 上实测 6 个单测失败。
  # 上限 <3.13：本文件把 ete3 直接列在 pip 段里，而 ete3 3.1.x 在 3.13+ 不可导入
  # （stdlib cgi 已被移除）。核心支持到 3.14；需要 ete3 时才受此上限约束，
  # 见 pyproject.toml 的 [project.optional-dependencies] ete3/ete4 标记。
  - python>=3.9,<3.13
  - pip

  # Core dependencies
  - biopython>=1.79,<2.0
  - pyyaml>=6.0,<7.0
  - scipy>=1.9.0,<2.0
  - numpy>=1.21.0
  - psutil>=5.9.0,<6.0
  - matplotlib>=3.5.0
  - pandas>=1.3.0

  # External bioinformatics tools
  - paml
  - iqtree

  # Development dependencies
  - pytest>=7.0
  - pytest-cov>=3.0
  - black>=22.0
  - flake8>=4.0
  - mypy>=1.0

  # Documentation
  - sphinx>=6.0
  - sphinx_rtd_theme>=1.0

  # Additional dependencies via pip
  - pip:
    - ete3>=3.1.2,<4.0
    - dendropy>=4.5.0
    - numpydoc>=1.5
