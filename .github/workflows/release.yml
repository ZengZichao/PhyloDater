name: Release to PyPI

# 打 v* 标签即发布：git tag v0.1.0 && git push origin v0.1.0
# 认证走 PyPI Trusted Publishing（OIDC），仓库无需配置任何 token。
# 前置的一次性配置见 docs（PyPI → Account settings → Publishing →
# 添加 pending publisher：Owner=ZengZichao, Repository=PhyloDater,
# Workflow=release.yml, Environment=pypi）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Smoke test the wheel
        run: |
          python -m pip install dist/*.whl
          phylodater --version

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # PyPI Trusted Publishing 所需的 OIDC 权限
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
