name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # Must match [tool.mypy] python_version in pyproject.toml: mypy type-checks
        # against the stubs of this interpreter, and numpy >= 2.5 requires 3.12+.
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check code formatting (black)
      run: black --check phylodater tests scripts test-data

    - name: Check import sorting (isort)
      run: isort --check phylodater tests scripts test-data

    - name: Lint with ruff
      run: ruff check phylodater tests scripts test-data

    - name: Check documentation policy (links, bilingual pairs, English-first)
      run: python scripts/check_docs.py

    - name: Type check with mypy
      # Blocking gate: ``mypy phylodater`` must report zero errors with
      # disallow_untyped_defs and warn_return_any enabled (both are on in
      # pyproject.toml). The 397-error baseline this step used to tolerate has
      # been paid off; see CONTRIBUTING.md ("Type checking").
      run: mypy phylodater

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Verified matrix (see test-data/benchmark/results/PYTHON_SUPPORT_MATRIX.txt):
        # 3.8 is excluded because the package needs importlib.resources.files (3.9+).
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run self-test
      run: |
        python -m phylodater check

    - name: Run tests with coverage
      # 排除 slow 与 requires_* 标记：这些测试调用真实外部定年引擎
      # （MCMCTree / treePL / PATHd8 / LSD2 / r8s / wLogDate / MD-Cat），
      # 而 CI runner 并未安装这些二进制，直接跑必然失败。它们由
      # `external-engines.yml` 在具备工具链的环境中单独执行。
      run: |
        coverage run -m pytest tests/ -v \
          -m "not slow and not requires_mcmctree and not requires_treepl and not requires_pathd8 and not requires_lsd2 and not requires_r8s and not requires_wlogdate and not requires_mdcat"
        coverage report

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: .coverage
